<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMM Store - Katalog Merchandise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZDHEG345FX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ZDHEG345FX');
</script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-heading { font-family: 'Rajdhani', sans-serif; }
        .bg-pattern {
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 2px, transparent 2px), radial-gradient(#1e293b 2px, transparent 2px);
            background-size: 40px 40px; background-position: 0 0, 20px 20px; background-attachment: fixed;
        }
        @keyframes fade-in-up { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-masuk { animation: fade-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; }
    </style>
</head>
<body class="bg-pattern text-slate-200 min-h-screen flex flex-col items-center py-6 px-4">

    <div class="max-w-lg w-full">
        
        <!-- HEADER & TOMBOL KEMBALI -->
        <header class="flex items-center justify-between mb-8 animate-masuk">
            <a href="index.html" class="flex items-center text-sm font-medium text-slate-400 hover:text-white bg-slate-800/50 px-3 py-1.5 rounded-lg border border-slate-700 transition-colors">
                <i class="fa-solid fa-arrow-left mr-2"></i> Kembali
            </a>
            <h1 class="font-heading text-2xl font-bold text-yellow-500 tracking-wider flex items-center">
                <i class="fa-solid fa-bag-shopping mr-2"></i> HMM STORE
            </h1>
        </header>

        <!-- GRID KATALOG PRODUK -->
        <div class="grid grid-cols-2 gap-4 animate-masuk delay-1">

            <!-- PRODUK 1 (Status: OPEN / READY) -->
            <div class="bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-lg group">
                <div class="aspect-square bg-slate-800 relative flex items-center justify-center border-b border-slate-700 overflow-hidden">
                    <i class="fa-solid fa-id-badge text-5xl text-slate-600 group-hover:scale-110 transition-transform duration-300"></i>
                    
                    <!-- Label Status -->
                    <div class="absolute top-2 right-2 bg-emerald-500 text-emerald-950 text-[10px] font-bold px-2 py-1 rounded shadow-md">
                        READY STOCK
                    </div>
                </div>
                <div class="p-3">
                    <h3 class="font-bold text-slate-100 text-sm mb-1 leading-tight">Gelang dan Stiker OSPROD</h3>
                    <p class="text-xs text-slate-400 mb-2">Identitas Anak Mesin. Stok terbatas.</p>
                    <p class="font-bold text-yellow-400 text-sm mb-3">Rp 15.000</p>
                    
                    <a href="https://wa.me/6285314479623?text=Halo%20Danus%20HMM,%20saya%20mau%20beli%20Gelang%20dan%20Stiker%20OSPROD.%20Apakah%20masih%20ada%20stok?" target="_blank" class="block w-full text-center bg-green-600 hover:bg-green-500 text-white text-xs font-bold py-2 rounded-lg transition-colors">
                        <i class="fa-brands fa-whatsapp mr-1"></i> Pesan (WA)
                    </a>
                </div>
            </div>

            <!-- PRODUK 2 (Status: CLOSED / HABIS) -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg group opacity-75">
                <div class="aspect-square bg-slate-800 relative flex items-center justify-center border-b border-slate-800 overflow-hidden">
                    <i class="fa-solid fa-mug-hot text-5xl text-slate-700"></i>
                    
                    <!-- Label Status -->
                    <div class="absolute top-2 right-2 bg-rose-500 text-white text-[10px] font-bold px-2 py-1 rounded shadow-md">
                        CLOSED / SOLD OUT
                    </div>
                </div>
                <div class="p-3">
                    <h3 class="font-bold text-slate-400 text-sm mb-1 leading-tight">Baju Birdong</h3>
                    <p class="text-xs text-slate-500 mb-2">Dresscode untuk kegiatan OSPROD.</p>
                    <p class="font-bold text-slate-500 text-sm mb-3">Rp 60.000</p>
                    
                    <!-- Tombol Mati (Disabled) -->
                    <button disabled class="w-full text-center bg-slate-800 text-slate-500 text-xs font-bold py-2 rounded-lg cursor-not-allowed">
                        Stok Habis
                    </button>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
